version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: taskweight_postgres_dev
    environment:
      POSTGRES_DB: taskweight
      POSTGRES_USER: taskweight_user
      POSTGRES_PASSWORD: taskweight_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - taskweight_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskweight_user -d taskweight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskweight_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - taskweight_network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: taskweight_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@taskweight.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - taskweight_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  taskweight_network:
    driver: bridge
